# 云服务器环境（服务器环境）
# 新架构：使用PostgreSQL + Schema隔离

server:
  port: 9006

spring:
  application:
    name: zhiyan-backend

  # PostgreSQL数据库配置（使用Schema进行逻辑隔离）
  datasource:
    # 在searchPath中包含所有schema，按优先级排序
    url: jdbc:postgresql://152.136.245.180:5432/zhiyanplatform?searchPath=zhiyanauth,zhiyanproject,zhiyantasks,zhiyanmessage
    username: postgres
    password: zjm10086
    driver-class-name: org.postgresql.Driver
    # HikariCP连接池配置
    hikari:
      pool-name: ZhiyanBackendHikariPool
      minimum-idle: 20
      maximum-pool-size: 50
      idle-timeout: 180000
      max-lifetime: 1800000
      connection-timeout: 20000

      # PostgreSQL Schema配置，包含所有业务schema
      connection-init-sql: SET search_path TO zhiyanauth, zhiyanproject, zhiyantasks, zhiyanmessage, zhiyanwiki

  # JPA配置
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        # 格式化SQL
        format_sql: true
        # 显示SQL
        show_sql: false
        use_sql_comments: true
        # 命名策略
        physical_naming_strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
        # JDBC批处理
        jdbc:
          batch_size: 50
          fetch_size: 50
        order_inserts: true
        order_updates: true
    show-sql: true
    open-in-view: true

  # 邮件配置 - 网易163邮箱
  mail:
    host: smtp.163.com
    port: 465
    username: zhiyan163verif@163.com
    password: UJrssfvfNrMJKvD4
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
            required: true
          # 163邮箱需要SSL连接
          socketFactory:
            class: javax.net.ssl.SSLSocketFactory
            port: 465
    default-encoding: UTF-8

  servlet:
    multipart:
      max-file-size: 512MB
      max-request-size: 512MB

  # Jackson配置
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
    #long-to-string-global: true

  # Redis配置（生产环境）
  data:
    redis:
      # Redis 服务器地址（生产环境）
      host: 152.136.245.180
      # Redis 服务器连接端口
      port: 6379
      # Redis 服务器连账密
      username: default
      password: zjm10086
      # 连接超时时间（毫秒）
      timeout: 30000
      # 命令超时时间
      connect-timeout: 10000
      # 数据库索引（0-15）
      database: 0
      lettuce:
        pool:
          # 连接池最大连接数
          max-active: 16
          # 连接池最大阻塞等待时间（使用负值表示没有限制）
          max-wait: 10000
          # 连接池中的最大空闲连接
          max-idle: 8
          # 连接池中的最小空闲连接
          min-idle: 2
        # 关闭超时时间
        shutdown-timeout: 100ms

# 验证码配置
app:
  verification-code:
    length: 6
    expire-minutes: 10
    rate-limit-minutes: 1
    enable-database-storage: true
    enable-email-sending: true
    enable-cleanup-task: true
    max-retry-attempts: 3
  name: 智研平台

# JWT配置
jwt:
  secret: "zhiyan-platform-2025-this-is-a-very-long-secret-key-for-jwt-tokens-256-bits"
  issuer: "zhiyan-platform"
  access-token-expire-minutes: 1440  # 1天 = 24小时 = 1440分钟
  refresh-token-expire-minutes: 10080  # 7天

# 自定义security配置
security:
  # Xss攻击过滤路径
  xss:
    enabled: true
    exclude-urls:
      - /actuator/**
      - /swagger-ui/**
      - /v3/api-docs/**
      - /error
      - /favicon.ico
      - /zhiyan/auth/send-verfcode
      - /zhiyan/auth/verify-code

# 日志配置
logging:
  # 明确指定不使用外部日志配置文件，使用Spring Boot默认的Logback
  config: ""  # 覆盖Nacos中可能存在的log4j2配置
  level:
    root: INFO
    hbnu.project.zhiyanbackend: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: INFO
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    com.zaxxer.hikari: INFO
    # 关闭特定框架的冗余日志
    org.springframework.data.redis.repository: WARN
    org.springframework.data.redis: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/zhiyan-backend.log
  logback:
    rollingpolicy:
      max-file-size: 50MB
      max-history: 30

# Swagger配置
swagger:
  title: "智研平台后端服务"
  description: "用户认证、项目管理、任务管理等核心功能"

# OpenAPI/Swagger 开启（云环境）
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui/index.html

knife4j:
  enable: true
  production: false

# SSE配置
sse:
  enabled: true

# Dify流式配置
dify:
  # Dify API 基础地址（注意：必须带协议 https://，并且以 /v1 结尾）
  api-url: "https://dify.aipfuture.com/v1"
  # Dify 应用的 API Key（你给的 app- 开头那串）
  api-key: "app-Z0Uo6XAytf94sGkSO7oYMQV5"
  # 其它参数按需保留
  stream-enabled: true
  knowledge:
    api-url: "https://dify.aipfuture.com/v1"
    api-key: "app-iuvOL1bW8iaKM17iOMaZgRdl"
    stream-enabled: true

# 腾讯云 COS 配置（使用环境变量注入）
tencent:
  cos:
    secret-id: ${TENCENT_COS_SECRET_ID}
    secret-key: ${TENCENT_COS_SECRET_KEY}
    region: ${TENCENT_COS_REGION}
    bucket-name: ${TENCENT_COS_BUCKET}
    # public-domain: ${TENCENT_COS_PUBLIC_DOMAIN}
    public-domain: https://bucket.zyplatform.xyz
    default-directory: uploads

# OAuth2第三方登录配置
zhiyan:
  oauth2:
    enabled: true
    callback-base-url: http://sf4a6f34.natappfree.cc
    frontend-home-url: https://zyplatform.xyz/home
    frontend-error-url: https://zyplatform.xyz/oauth2/error

    # GitHub 配置
    github_enabled: true
    github_clientId: Ov23liNSEUAOKgBl1xBA
    github_clientSecret: ${GITHUB_CLIENT_SECRET}
    github_scope: "read:user user:email"
    github_authorizationUri: https://github.com/login/oauth/authorize
    github_tokenUri: https://github.com/login/oauth/access_token
    github_userInfoUri: https://api.github.com/user
    github_userEmailUri: https://api.github.com/user/emails

    # ORCID 配置
    orcid_enabled: true
    orcid_clientId: APP-GRP904LYKJZPI54F
    orcid_clientSecret: ${ORCID_CLIENT_SECRET:625d17b7-c0d2-43c7-a607-5532b9614f17}
    # 已经解决（/authenticate openid也能查询个人公开信息）：经过本人探索，ORCID的授权范围不能多写，只能写一个，/authenticate openid就负责登录，/read-limited就是读取个人信息，这两者单独拿出来都能正常工作，现在就是考虑如何分开分别生效
    orcid_scope: "/authenticate openid"
    orcid_authorizationUri: https://orcid.org/oauth/authorize
    orcid_tokenUri: https://orcid.org/oauth/token
    orcid_userInfoUri: https://pub.orcid.org/v3.0
    orcid_apiVersion: v3.0
baidu:
  ocr:
    app-id: 7387606
    api-key: ${BAIDU_OCR_APIKEY}
    secret-key: ${BAIDU_OCR_SECRETKEY}
